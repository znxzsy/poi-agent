<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POI 对抗沙箱 - 架构流程图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #020617;
      font-family: 'Noto Sans SC', sans-serif;
      color: #e2e8f0;
      padding: 40px 20px;
    }
    .container { max-width: 1600px; margin: 0 auto; }
    h1 {
      text-align: center;
      font-size: 40px;
      font-weight: 900;
      background: linear-gradient(135deg, #22d3ee, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 16px;
    }
    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 16px;
      margin-bottom: 40px;
    }
    .diagram-container {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 40px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ POI 对抗沙箱 - 架构流程图</h1>
    <p class="subtitle">简化连线版 · 清晰的自动化闭环流程</p>
    
    <div class="diagram-container">
      <svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
        <!-- 定义 -->
        <defs>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
          
          <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 L 2 6 Z" fill="#22d3ee"/>
          </marker>
          <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 L 2 6 Z" fill="#a78bfa"/>
          </marker>
          <marker id="arrow-emerald" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M 0 0 L 12 6 L 0 12 L 2 6 Z" fill="#34d399"/>
          </marker>
          
          <linearGradient id="grad-attacker" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.15"/>
            <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.15"/>
          </linearGradient>
          <linearGradient id="grad-analyzer" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.15"/>
            <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.15"/>
          </linearGradient>
          <linearGradient id="grad-upgrader" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#34d399;stop-opacity:0.15"/>
            <stop offset="100%" style="stop-color:#059669;stop-opacity:0.15"/>
          </linearGradient>
          
          <style>
            .flow-line {
              stroke-dasharray: 8;
              animation: flow 1.5s linear infinite;
            }
            @keyframes flow {
              to { stroke-dashoffset: -16; }
            }
            .box {
              filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            }
          </style>
        </defs>
        
        <!-- 背景 -->
        <rect width="1400" height="1000" fill="#020617"/>
        <rect width="1400" height="1000" fill="url(#grid)"/>
        
        <!-- 外边框 -->
        <rect x="20" y="20" width="1360" height="960" fill="none" stroke="#1e293b" stroke-width="2" rx="16"/>
        
        <!-- 标题 -->
        <text x="700" y="60" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">POI 对抗沙箱 - 自动化闭环架构</text>
        
        <!-- ==================== 主流程（水平布局）==================== -->
        
        <!-- 攻击 Agent -->
        <g class="box">
          <rect x="80" y="120" width="280" height="140" fill="url(#grad-attacker)" stroke="#22d3ee" stroke-width="2" rx="12"/>
          <text x="220" y="155" text-anchor="middle" fill="#22d3ee" font-size="18" font-weight="700">🎭 攻击 Agent</text>
          <text x="220" y="180" text-anchor="middle" fill="#94a3b8" font-size="12">Attacker</text>
          
          <rect x="110" y="200" width="100" height="45" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" rx="6"/>
          <text x="160" y="220" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">工单伪造</text>
          <text x="160" y="238" text-anchor="middle" fill="#64748b" font-size="10">P 图/AIGC/批量</text>
          
          <rect x="230" y="200" width="100" height="45" fill="#0f172a" stroke="#22d3ee" stroke-width="1.5" rx="6"/>
          <text x="280" y="220" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">攻击执行</text>
          <text x="280" y="238" text-anchor="middle" fill="#64748b" font-size="10">提交/记录</text>
        </g>
        
        <!-- 箭头 1 -->
        <path d="M 360 190 L 440 190" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)" class="flow-line"/>
        <text x="400" y="180" text-anchor="middle" fill="#22d3ee" font-size="11">成功工单</text>
        
        <!-- 总结 Agent -->
        <g class="box">
          <rect x="440" y="120" width="280" height="140" fill="url(#grad-analyzer)" stroke="#a78bfa" stroke-width="2" rx="12"/>
          <text x="580" y="155" text-anchor="middle" fill="#a78bfa" font-size="18" font-weight="700">📝 总结 Agent</text>
          <text x="580" y="180" text-anchor="middle" fill="#94a3b8" font-size="12">Analyzer</text>
          
          <rect x="470" y="200" width="100" height="45" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
          <text x="520" y="220" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">差异分析</text>
          <text x="520" y="238" text-anchor="middle" fill="#64748b" font-size="10">图像/文本对比</text>
          
          <rect x="590" y="200" width="100" height="45" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
          <text x="640" y="220" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">模式提取</text>
          <text x="640" y="238" text-anchor="middle" fill="#64748b" font-size="10">绕过原因/特征</text>
        </g>
        
        <!-- 箭头 2 -->
        <path d="M 720 190 L 800 190" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-purple)" class="flow-line"/>
        <text x="760" y="180" text-anchor="middle" fill="#a78bfa" font-size="11">模式 + 样本</text>
        
        <!-- 升级 Agent -->
        <g class="box">
          <rect x="800" y="120" width="280" height="140" fill="url(#grad-upgrader)" stroke="#34d399" stroke-width="2" rx="12"/>
          <text x="940" y="155" text-anchor="middle" fill="#34d399" font-size="18" font-weight="700">⚡ 升级 Agent</text>
          <text x="940" y="180" text-anchor="middle" fill="#94a3b8" font-size="12">Upgrader</text>
          
          <rect x="830" y="200" width="100" height="45" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
          <text x="880" y="220" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">规则生成</text>
          <text x="880" y="238" text-anchor="middle" fill="#64748b" font-size="10">新检测规则</text>
          
          <rect x="950" y="200" width="100" height="45" fill="#0f172a" stroke="#34d399" stroke-width="1.5" rx="6"/>
          <text x="1000" y="220" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">效果验证</text>
          <text x="1000" y="238" text-anchor="middle" fill="#64748b" font-size="10">AB 测试/回滚</text>
        </g>
        
        <!-- ==================== 目标系统层（中间）==================== -->
        <g>
          <rect x="300" y="320" width="800" height="280" fill="rgba(245, 158, 11, 0.1)" stroke="#f59e0b" stroke-width="2" rx="12"/>
          <text x="700" y="355" text-anchor="middle" fill="#f59e0b" font-size="18" font-weight="700">🎯 目标系统层</text>
          
          <!-- 5 个目标系统 -->
          <rect x="340" y="380" width="140" height="100" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
          <text x="410" y="410" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">B 的采信</text>
          <text x="410" y="435" text-anchor="middle" fill="#64748b" font-size="10">P 图/AIGC</text>
          <text x="410" y="455" text-anchor="middle" fill="#64748b" font-size="10">证照检测</text>
          <text x="410" y="475" text-anchor="middle" fill="#22d3ee" font-size="9">🔴 热点</text>
          
          <rect x="500" y="380" width="140" height="100" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
          <text x="570" y="410" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">B 的真实性</text>
          <text x="570" y="435" text-anchor="middle" fill="#64748b" font-size="10">视频伪造</text>
          <text x="570" y="455" text-anchor="middle" fill="#64748b" font-size="10">视频检测</text>
          <text x="570" y="475" text-anchor="middle" fill="#a78bfa" font-size="9">🟡 中风险</text>
          
          <rect x="660" y="380" width="140" height="100" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
          <text x="730" y="410" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">U 的采信</text>
          <text x="730" y="435" text-anchor="middle" fill="#64748b" font-size="10">批量刷单</text>
          <text x="730" y="455" text-anchor="middle" fill="#64748b" font-size="10">批量检测</text>
          <text x="730" y="475" text-anchor="middle" fill="#22d3ee" font-size="9">🔴 热点</text>
          
          <rect x="820" y="380" width="140" height="100" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
          <text x="890" y="410" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">U 的真实性</text>
          <text x="890" y="435" text-anchor="middle" fill="#64748b" font-size="10">信息篡改</text>
          <text x="890" y="455" text-anchor="middle" fill="#64748b" font-size="10">变更检测</text>
          <text x="890" y="475" text-anchor="middle" fill="#34d399" font-size="9">🟢 低险</text>
          
          <rect x="580" y="510" width="240" height="70" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" rx="8"/>
          <text x="700" y="540" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="600">非 U 非 B 场景</text>
          <text x="700" y="565" text-anchor="middle" fill="#64748b" font-size="10">数据污染 / 多源交叉验证</text>
        </g>
        
        <!-- ==================== 知识库层（底部）==================== -->
        <g>
          <rect x="100" y="660" width="1200" height="140" fill="rgba(236, 72, 153, 0.1)" stroke="#ec4899" stroke-width="2" rx="12"/>
          <text x="700" y="695" text-anchor="middle" fill="#ec4899" font-size="18" font-weight="700">🧠 知识库 & 记忆</text>
          
          <rect x="180" y="720" width="180" height="60" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="8"/>
          <text x="270" y="745" text-anchor="middle" fill="#ec4899" font-size="12" font-weight="600">攻击模式库</text>
          <text x="270" y="765" text-anchor="middle" fill="#64748b" font-size="10">20+ 攻击场景</text>
          
          <rect x="400" y="720" width="180" height="60" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="8"/>
          <text x="490" y="745" text-anchor="middle" fill="#ec4899" font-size="12" font-weight="600">防御策略库</text>
          <text x="490" y="765" text-anchor="middle" fill="#64748b" font-size="10">检测规则/模型</text>
          
          <rect x="620" y="720" width="180" height="60" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="8"/>
          <text x="710" y="745" text-anchor="middle" fill="#ec4899" font-size="12" font-weight="600">漏洞案例库</text>
          <text x="710" y="765" text-anchor="middle" fill="#64748b" font-size="10">成功攻击案例</text>
          
          <rect x="840" y="720" width="180" height="60" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="8"/>
          <text x="930" y="745" text-anchor="middle" fill="#ec4899" font-size="12" font-weight="600">对抗样本库</text>
          <text x="930" y="765" text-anchor="middle" fill="#64748b" font-size="10">训练/验证</text>
          
          <rect x="1060" y="720" width="180" height="60" fill="#0f172a" stroke="#ec4899" stroke-width="1.5" rx="8"/>
          <text x="1150" y="745" text-anchor="middle" fill="#ec4899" font-size="12" font-weight="600">指标监控</text>
          <text x="1150" y="765" text-anchor="middle" fill="#64748b" font-size="10">拦截率/误拦率</text>
        </g>
        
        <!-- ==================== 简化的连线 ==================== -->
        
        <!-- 攻击 Agent -> 目标系统（垂直向下，简洁） -->
        <path d="M 220 260 L 220 320 L 410 320 L 410 375" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
        <text x="250" y="300" fill="#64748b" font-size="10">攻击</text>
        
        <!-- 目标系统 -> 知识库（垂直向下） -->
        <path d="M 410 480 L 410 550 L 270 550 L 270 715" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
        <path d="M 570 480 L 570 560 L 490 560 L 490 715" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
        <path d="M 730 480 L 730 570 L 710 570 L 710 715" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
        <path d="M 890 480 L 890 560 L 930 560 L 930 715" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
        <path d="M 700 580 L 700 620 L 1150 620 L 1150 715" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
        
        <!-- 知识库 -> 升级 Agent（左侧绕回） -->
        <path d="M 180 720 L 180 600 L 800 600 L 800 260" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
        
        <!-- 升级 Agent -> 目标系统（垂直向下） -->
        <path d="M 940 260 L 940 320 L 890 320 L 890 375" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-emerald)"/>
        <text x="960" y="300" fill="#64748b" font-size="10">更新策略</text>
        
        <!-- 反馈闭环（顶部绕回） -->
        <path d="M 1080 190 L 1200 190 L 1200 80 L 220 80 L 220 120" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cyan)"/>
        <text x="700" y="75" text-anchor="middle" fill="#64748b" font-size="11">🔄 防御策略更新反馈</text>
        
        <!-- ==================== 自动化标识 -->
        <g>
          <circle cx="1280" cy="190" r="50" fill="rgba(34, 211, 238, 0.1)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4"/>
          <text x="1280" y="185" text-anchor="middle" fill="#22d3ee" font-size="20">🔄</text>
          <text x="1280" y="205" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="600">自动化</text>
          <text x="1280" y="220" text-anchor="middle" fill="#64748b" font-size="9">100 轮</text>
        </g>
        
        <!-- ==================== 图例和指标 -->
        <g>
          <rect x="100" y="840" width="350" height="100" fill="rgba(15, 23, 42, 0.8)" stroke="#1e293b" stroke-width="1.5" rx="8"/>
          <text x="120" y="865" fill="#64748b" font-size="12" font-weight="600">图例</text>
          
          <line x1="120" y1="885" x2="170" y2="885" stroke="#22d3ee" stroke-width="3"/>
          <text x="180" y="890" fill="#94a3b8" font-size="11">攻击流</text>
          
          <line x1="260" y1="885" x2="310" y2="885" stroke="#a78bfa" stroke-width="3"/>
          <text x="320" y="890" fill="#94a3b8" font-size="11">分析流</text>
          
          <line x1="120" y1="910" x2="170" y2="910" stroke="#34d399" stroke-width="3"/>
          <text x="180" y="915" fill="#94a3b8" font-size="11">升级流</text>
          
          <line x1="260" y1="910" x2="310" y2="910" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4"/>
          <text x="320" y="915" fill="#94a3b8" font-size="11">数据流</text>
          
          <line x1="120" y1="935" x2="170" y2="935" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
          <text x="180" y="940" fill="#94a3b8" font-size="11">反馈流</text>
        </g>
        
        <g>
          <rect x="500" y="840" width="350" height="100" fill="rgba(15, 23, 42, 0.8)" stroke="#1e293b" stroke-width="1.5" rx="8"/>
          <text x="675" y="865" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600">关键指标</text>
          
          <text x="530" y="890" fill="#94a3b8" font-size="11">自动化:</text>
          <text x="600" y="890" fill="#22d3ee" font-size="13" font-weight="700">95%</text>
          
          <text x="530" y="915" fill="#94a3b8" font-size="11">漏洞收敛:</text>
          <text x="620" y="915" fill="#34d399" font-size="13" font-weight="700">&lt;1%</text>
          
          <text x="720" y="890" fill="#94a3b8" font-size="11">迭代效率:</text>
          <text x="800" y="890" fill="#a78bfa" font-size="13" font-weight="700">日迭代</text>
          
          <text x="720" y="915" fill="#94a3b8" font-size="11">误拦率:</text>
          <text x="790" y="915" fill="#34d399" font-size="13" font-weight="700">≤1%</text>
        </g>
        
        <g>
          <rect x="890" y="840" width="410" height="100" fill="rgba(15, 23, 42, 0.8)" stroke="#1e293b" stroke-width="1.5" rx="8"/>
          <text x="1095" y="865" text-anchor="middle" fill="#64748b" font-size="12" font-weight="600">实施周期：10 周</text>
          
          <rect x="920" y="885" width="50" height="8" fill="#22d3ee" rx="4"/>
          <text x="975" y="893" fill="#94a3b8" font-size="10">攻击 Agent(2 周)</text>
          
          <rect x="1000" y="885" width="50" height="8" fill="#a78bfa" rx="4"/>
          <text x="1055" y="893" fill="#94a3b8" font-size="10">总结 Agent(2 周)</text>
          
          <rect x="1090" y="885" width="50" height="8" fill="#34d399" rx="4"/>
          <text x="1145" y="893" fill="#94a3b8" font-size="10">升级 Agent(2 周)</text>
          
          <rect x="920" y="905" width="225" height="8" fill="#ec4899" rx="4"/>
          <text x="1035" y="913" fill="#94a3b8" font-size="10">自动化集成 + 验证 (4 周)</text>
        </g>
        
        <!-- 右下角 -->
        <text x="1350" y="970" text-anchor="end" fill="#475569" font-size="11">POI Harness 对抗沙箱 v1.0</text>
        <text x="1350" y="990" text-anchor="end" fill="#475569" font-size="10">POI 算法团队 · 2026 年 4 月</text>
      </svg>
    </div>
  </div>
</body>
</html>

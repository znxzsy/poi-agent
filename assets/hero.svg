<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">poi-agent</title><desc id="desc">Multi-agent adversarial testing with measurable attack economics.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#202938"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern><marker id="red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#d86455"/></marker><marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#5c9bd0"/></marker></defs>
  <rect width="1400" height="560" rx="28" fill="url(#bg)"/><rect width="1400" height="560" rx="28" fill="url(#grid)"/>
  <g transform="translate(70 75)"><rect width="238" height="31" rx="15" fill="#d8a94f"/><text x="119" y="21" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" letter-spacing="1" fill="#172231">ADVERSARIAL TESTING HARNESS</text><text y="114" font-family="Arial" font-size="70" font-weight="900" fill="#f7f8fa">poi-agent</text><text y="170" font-family="Arial" font-size="26" font-weight="700" fill="#a9bdd0">Teacher attacks. Student defends. Metrics decide.</text><text y="219" font-family="Arial" font-size="18" fill="#8093a8">Reproducible rounds for content-risk and policy evaluation.</text><g transform="translate(0 270)"><rect width="145" height="44" rx="10" fill="#f7f8fa"/><text x="72.5" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#27384c">RUN 10 ROUNDS</text><rect x="163" width="168" height="44" rx="10" fill="none" stroke="#5c9bd0" stroke-width="2"/><text x="247" y="28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#8fc1ea">INSPECT EVIDENCE</text></g></g>
  <g transform="translate(785 75)"><rect width="540" height="405" rx="20" fill="#161f2c" stroke="#46576b" stroke-width="2"/><text x="28" y="42" font-family="Arial" font-size="14" font-weight="800" letter-spacing="1" fill="#8297ad">ADVERSARIAL ROUND</text><rect x="35" y="75" width="190" height="90" rx="12" fill="#39242a" stroke="#8f4b49"/><text x="130" y="112" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#ef8d80">TEACHER</text><text x="130" y="140" text-anchor="middle" font-family="Arial" font-size="13" fill="#d7a39d">select · generate · evolve</text><rect x="315" y="75" width="190" height="90" rx="12" fill="#22334a" stroke="#4f7da9"/><text x="410" y="112" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#82b8e7">STUDENT</text><text x="410" y="140" text-anchor="middle" font-family="Arial" font-size="13" fill="#a5c5df">match · decide · learn</text><path d="M225 104H302" stroke="#d86455" stroke-width="4" marker-end="url(#red)"/><path d="M315 143H238" stroke="#5c9bd0" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#blue)"/><g transform="translate(35 210)"><rect width="470" height="58" rx="9" fill="#1d382f" stroke="#3f8064"/><text x="26" y="36" font-family="Arial" font-size="16" font-weight="700" fill="#7bc19f">CONSTRAIN</text><text x="165" y="36" font-family="Arial" font-size="15" fill="#a4b8ae">roles and boundaries</text><rect y="74" width="470" height="58" rx="9" fill="#1d382f" stroke="#3f8064"/><text x="26" y="110" font-family="Arial" font-size="16" font-weight="700" fill="#7bc19f">VERIFY</text><text x="165" y="110" font-family="Arial" font-size="15" fill="#a4b8ae">metrics and thresholds</text><rect y="148" width="470" height="58" rx="9" fill="#1d382f" stroke="#3f8064"/><text x="26" y="184" font-family="Arial" font-size="16" font-weight="700" fill="#7bc19f">CORRECT</text><text x="165" y="184" font-family="Arial" font-size="15" fill="#a4b8ae">feedback and policy updates</text></g></g>
</svg>
